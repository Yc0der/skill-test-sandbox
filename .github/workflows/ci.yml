name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Every third-party action below is pinned to a full commit SHA, not a tag.
      # Tags are mutable; a full SHA cannot be silently repointed. Dependabot
      # (.github/dependabot.yml) opens a PR when a newer release exists so these
      # pins get updated through review instead of rotting in place.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm must be on PATH *before* setup-node runs, because `cache: 'pnpm'` makes
      # setup-node call `pnpm store path` to find the cache directory. Putting setup-node
      # first fails with "Unable to locate executable file: pnpm".
      # No version input needed — the action reads `packageManager` from package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # Node 22, not 20: vitest 4 requires ^20.19 || >=22.12, so a bare "20" can
      # resolve to a version that fails at startup.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build
